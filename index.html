<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🍅 Pomodoro Timer</h1>
            <p class="subtitle">Focus, work, repeat</p>
        </header>

        <div class="mode-tabs">
            <button class="tab active" data-mode="work" onclick="setMode('work')">Work</button>
            <button class="tab" data-mode="break" onclick="setMode('break')">Break</button>
        </div>

        <div class="timer-display">
            <div class="circle">
                <span id="time">25:00</span>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn" onclick="toggleTimer()">Start</button>
            <button id="resetBtn" onclick="resetTimer()">Reset</button>
        </div>

        <div class="stats">
            <div class="stat">
                <span class="stat-value" id="completedCount">0</span>
                <span class="stat-label">Completed</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="totalMinutes">0</span>
                <span class="stat-label">Minutes Focused</span>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
